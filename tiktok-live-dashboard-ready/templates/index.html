<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TikTok LIVE Monitor</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: dark; }
    body { margin:0; background:#0b0d12; color:#f4f5f7; }
    .wrap { max-width:1100px; margin:36px auto; padding:0 18px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    h1 { margin:0; font-size:30px; }
    .muted { color:#9aa3b2; }
    .panel { background:#141821; border:1px solid #252b38; border-radius:18px; padding:18px; margin-top:18px; }
    form { display:flex; gap:10px; flex-wrap:wrap; }
    input { flex:1; min-width:220px; background:#0d1118; color:white; border:1px solid #303848; border-radius:12px; padding:12px 14px; }
    button { border:0; border-radius:12px; padding:12px 15px; font-weight:700; cursor:pointer; }
    .primary { background:white; color:black; }
    .secondary { background:#242a36; color:white; }
    .summary { background:#193523; color:#8ff0b1; }
    .basket { background:#392f13; color:#ffd96a; }
    .danger { background:#391a22; color:#ffb4c0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin-top:14px; }
    .card { background:#11151d; border:1px solid #252b38; border-radius:16px; padding:16px; }
    .row { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .badge { font-size:12px; font-weight:800; padding:6px 9px; border-radius:999px; }
    .live { background:#153a29; color:#7af0ad; }.off { background:#2c3038; color:#c2c8d1; }.unknown { background:#3b3218; color:#ffd56a; }
    .agent-has { color:#7af0ad; }.agent-none { color:#c2c8d1; }.agent-unknown { color:#ffd56a; }
    .error { color:#ff9eaa; font-size:12px; overflow-wrap:anywhere; margin-top:8px; }
    table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:10px 8px; border-bottom:1px solid #252b38; font-size:14px; }
  </style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>TikTok LIVE Monitor</h1><div class="muted">เช็กทุก {{ interval }} วินาที • Telegram แจ้งเมื่อสถานะเปลี่ยน • สรุปทุก 15 นาที</div></div>
<div><button class="secondary" onclick="checkNow()">เช็กตอนนี้</button> <button class="secondary" onclick="testTelegram()">ทดสอบ Telegram</button> <button class="summary" onclick="testSummary()">📊 ทดสอบสรุป 15 นาที</button></div></div>
<div class="panel"><form id="addForm"><input id="username" placeholder="@username หรือ username" autocomplete="off"><button class="primary" type="submit">+ เพิ่มช่อง</button></form><div id="cards" class="grid"></div></div>
<div class="panel"><div class="row"><h2 style="margin:0">ประวัติล่าสุด</h2><span class="muted">100 รายการ</span></div><div style="overflow:auto;margin-top:8px"><table><thead><tr><th>ช่อง</th><th>เหตุการณ์</th><th>เวลา</th><th>ระยะเวลา</th></tr></thead><tbody id="events"></tbody></table></div></div>
</div><script>
const dt=s=>s?new Date(s).toLocaleString('th-TH'):'-';
const dur=s=>{if(s===null||s===undefined)return '-';let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return [h,m,sec].map(x=>String(x).padStart(2,'0')).join(':')};
function agentText(c){if(c.basket_agent_status==='has')return '<span class="agent-has">🛒 Agent: มีตะกร้า</span>';if(c.basket_agent_status==='none')return '<span class="agent-none">🚫 Agent: ไม่พบตะกร้า</span>';if(c.basket_agent_status==='unknown')return '<span class="agent-unknown">⚠️ Agent: ตรวจไม่ได้</span>';return '<span class="muted">🖥️ Agent: ยังไม่มีข้อมูล</span>'}
async function load(){const channels=await fetch('/api/channels').then(r=>r.json());document.getElementById('cards').innerHTML=channels.map(c=>{let cls='unknown',label='กำลังเช็ก...';if(c.is_live===1){cls='live';label='🟢 LIVE'}if(c.is_live===0){cls='off';label='⚫ OFFLINE'}return `<div class="card"><div class="row"><strong style="font-size:18px">@${c.username}</strong><span class="badge ${cls}">${label}</span></div><div class="muted" style="margin-top:10px">เริ่มไลฟ์: ${dt(c.live_started_at)}</div><div class="muted">เช็กล่าสุด: ${dt(c.last_checked_at)}</div><div style="margin-top:6px">${agentText(c)}</div><div class="muted">Agent เช็กล่าสุด: ${dt(c.basket_agent_checked_at)}</div>${c.basket_agent_error?`<div class="error">🖥️ ${c.basket_agent_error}</div>`:''}${c.last_error?`<div class="error">⚠ ${c.last_error}</div>`:''}<div class="actions"><button class="basket" onclick="checkBasket('${c.username}',this)">🛒 เช็กตะกร้าจาก Railway</button><button class="danger" onclick="removeChannel(${c.id})">ลบ</button></div></div>`}).join('');const events=await fetch('/api/events').then(r=>r.json());document.getElementById('events').innerHTML=events.map(e=>`<tr><td>@${e.username}</td><td>${e.event_type==='START'?'🟢 เริ่ม LIVE':'🔴 หยุด LIVE'}</td><td>${dt(e.event_at)}</td><td>${dur(e.duration_seconds)}</td></tr>`).join('')}
document.getElementById('addForm').addEventListener('submit',async e=>{e.preventDefault();const username=document.getElementById('username').value.trim();const r=await fetch('/api/channels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})});const data=await r.json();if(!r.ok)return alert(data.error||'เพิ่มไม่ได้');document.getElementById('username').value='';await load()});
async function removeChannel(id){if(!confirm('ลบช่องนี้?'))return;await fetch('/api/channels/'+id,{method:'DELETE'});await load()}
async function checkNow(){await fetch('/api/check-now',{method:'POST'});setTimeout(load,1800)}
async function testTelegram(){const r=await fetch('/api/test-telegram',{method:'POST'});const d=await r.json();alert(r.ok?'ส่งข้อความทดสอบแล้ว':d.error)}
async function testSummary(){const r=await fetch('/api/test-summary',{method:'POST'});const d=await r.json();alert(r.ok?'ส่งสรุปสถานะไป Telegram แล้ว':'ส่งไม่ได้: '+d.error)}
async function checkBasket(username,btn){const old=btn.textContent;btn.disabled=true;btn.textContent='กำลังเช็ก...';try{const r=await fetch('/api/check-basket/'+encodeURIComponent(username));const d=await r.json();if(!r.ok)throw new Error(d.error||'เช็กไม่ได้');if(d.has_basket===true)alert('🛒 @'+username+' มีตะกร้า/พบข้อมูลสินค้า');else if(d.has_basket===false)alert('🚫 @'+username+' ไม่พบตะกร้า');else alert('⚠️ @'+username+' ตรวจตะกร้าไม่ได้: '+(d.error||'TikTok ไม่ให้ข้อมูล'));}catch(e){alert('⚠️ เช็กตะกร้าไม่ได้: '+e.message)}finally{btn.disabled=false;btn.textContent=old}}
load();setInterval(load,10000);
</script></body></html>
