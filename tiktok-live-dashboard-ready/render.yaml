services:
  - type: web
    name: tiktok-live-monitor
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CHECK_INTERVAL
        value: "60"
      - key: DB_PATH
        value: /var/data/dashboard.db
    disk:
      name: live-monitor-data
      mountPath: /var/data
      sizeGB: 1
